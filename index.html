<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>notyet</title>
  <meta name="description" content="notyet's personal site -- indie dev, creative experiments, and Sophie Stops the Sun." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Lora:ital,wght@0,400;0,600;1,400&family=Caveat:wght@400;600&family=Space+Mono:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
      position: relative;
      z-index: 2;
    }

    .splash-ascii {
      font-family: var(--font-mono);
      font-size: clamp(0.3rem, 0.85vw, 0.5rem);
      line-height: 1.2;
      color: var(--ink-dim);
      opacity: 0.4;
      white-space: pre;
      margin-bottom: 1.5rem;
      letter-spacing: 0px;
      user-select: none;
      overflow: hidden;
      max-width: 90vw;
      text-align: left;
      display: inline-block;
    }

    .splash-title {
      font-family: var(--font-pixel);
      font-size: clamp(4rem, 12vw, 8rem);
      color: var(--heading);
      letter-spacing: 8px;
      text-transform: lowercase;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .splash-sub {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--ink-dim);
      letter-spacing: 3px;
      text-transform: lowercase;
      margin-bottom: 3rem;
      opacity: 0.6;
    }

    .splash-enter {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--ink);
      letter-spacing: 4px;
      text-transform: lowercase;
      text-decoration: none;
      padding: 0.6rem 2rem;
      border: 1px solid var(--border-light);
      transition: all 0.3s ease;
      position: relative;
    }
    .splash-enter:hover {
      color: var(--heading);
      border-color: var(--heading);
      letter-spacing: 6px;
      background: rgba(255,255,255,0.03);
    }
    .splash-enter::after { display: none; }

    .splash-enter .blink {
      animation: cursorBlink 1s step-end infinite;
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .splash-footer {
      position: fixed;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: var(--ink-dim);
      opacity: 0.3;
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 2;
    }

    /* fade in sequence */
    .splash-ascii,
    .splash-title,
    .splash-sub,
    .splash-enter {
      opacity: 0;
      transform: translateY(10px);
      animation: splashFadeIn 0.8s ease forwards;
    }
    .splash-ascii  { animation-delay: 0.2s; }
    .splash-title  { animation-delay: 1.0s; }
    .splash-sub    { animation-delay: 1.6s; }
    .splash-enter  { animation-delay: 2.2s; }

    @keyframes splashFadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-ascii,
      .splash-title,
      .splash-sub,
      .splash-enter {
        opacity: 1;
        transform: none;
        animation: none;
      }
      .splash-enter .blink {
        animation: none;
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div id="stars" aria-hidden="true"></div>

  <div class="splash">
    <div class="splash-ascii" id="splash-art" aria-hidden="true"></div>

    <h1 class="splash-title" data-text="notyet">notyet</h1>
    <p class="splash-sub">personal site &middot; indie dev &middot; creative experiments</p>

    <a href="home.html" class="splash-enter">
      enter<span class="blink">_</span>
    </a>
  </div>

  <div class="splash-footer">best viewed at 1024x768 with your heart open</div>

  <script>
    // ASCII art (using textContent to preserve backslashes perfectly)
    const art = document.getElementById('splash-art');
    if (art) {
      art.textContent = [
        '                 0            0',
        '                  \\          /',
        '                ___\\________/_________',
        '               /o   \\      /        o/|',
        '              /.. .. \\. ../.. .. .. /o|',
        '             /........\\../........./. |',
        '            /_____________________/o. |',
        '           |o  _               _ o|.  |     Bip bop.',
        '           |   \\\\             //  |.. |     I will destroy',
        '           |   _\\\\           //_  |.  |     the humanity.',
        '           |  /  \\\\_________//  \\ |.. |     Bip bop.',
        '           |  |##|\\_________/|##| |.  |',
        '           |  \\__/           \\__/ |.. |',
        '           |                      |. o|',
        'VV     VV  |   _________________  |../|  VV     VV',
        '||     ||  |  (_________________) |o/o|  ||     ||',
        '||     ||  |o____________________o|/:;|  ||     ||',
        ' \\\\   //   |o::::::::::::::::::::o|o;.|   \\\\   //',
        '  \\\\ //    |;;;;;;;;;;;;;;;;;;;;;;|:..|    \\\\ //',
        '   |%|     |. . . . . . . . . . . |..;|     |%|',
        '   |%|     |. . . . . . . . . . . |.;;|     |%|',
        '   |%+-----|;;;;;;;;;;;;;;;;;;;;;;|(--------+%|',
        '   +-------|;;;;;;;;;;;;;;;;;;;;;;|(----------+',
        '           |. . . . . . . . . . . |..;|',
        '           |. . . . . . . . . . . |.;;|',
        '           |;;;;;;;;;;;;;;;;;;;;;;|:;;|',
        '           |;;;;;;;;;;;;;;;;;;;;;;|:;.|',
        '           |. . . . . . . . . . . |..;|',
        '           |. . . . . . . . . . . |.;;|',
        '           |;;;;;;;;;;;;;;;;;;;;;;|:;.|',
        '           |;;;;;;;;;;;;;;;;;;;;;;|:.o/',
        '           |. . . . . . . . . . . |../',
        '           |. . . . . . . . . . . |o/',
        '           |o____________________o|/|',
        '            |o....o|;.|   |o....o|;.|',
        '            |      |; |   |      |; |',
        '            |      |; |   |      |; |',
        '            |      |; |   |      |; |',
        '            |      |;.+   |      |;.+',
        '            |*#*#*#|;/    |*#*#*#|;/',
        '            |o~~~~o|/     |o~~~~o|/',
        '            +------+      +------+'
      ].join('\n');
    }

    // Fireflies on splash
    const starBox = document.getElementById('stars');
    if (starBox) {
      for (let i = 0; i < 25; i++) {
        const d = document.createElement('div');
        d.className = 'firefly';
        const size = Math.random() * 2 + 1;
        d.style.cssText = `
          width:${size}px; height:${size}px;
          top:${Math.random()*100}%; left:${Math.random()*100}%;
          background:rgba(200,200,200,0.6);
          --dur:${(Math.random()*6+4).toFixed(1)}s;
          --delay:${(Math.random()*4).toFixed(1)}s;
          --dx:${(Math.random()*60-30).toFixed(0)}px;
          --dy:${(Math.random()*60-30).toFixed(0)}px;
          --peak:${(Math.random()*0.3+0.2).toFixed(2)};
        `;
        starBox.appendChild(d);
      }
    }

    // Day mode persistence
    if (localStorage.getItem('theme') === 'day') document.body.classList.add('day-mode');

    // Ghost cursor trail on splash
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isTouch = window.matchMedia('(pointer: coarse)').matches;
    if (!prefersReduced && !isTouch) {
      const TRAIL_COUNT = 5, FRICTION = 0.75, SPRING = 0.1;
      const LIGHT_CUR = "assets/guy-cusor-final/Guy-Normal%20select.cur";
      const DARK_CUR  = "assets/guy-cusor-final-dark/Guy-Normal%20select.cur";
      const curSrc = document.body.classList.contains('day-mode') ? LIGHT_CUR : DARK_CUR;
      const dots = [];
      let mx = -100, my = -100;
      for (let i = 0; i < TRAIL_COUNT; i++) {
        const el = document.createElement('div');
        el.className = 'trail-dot';
        const sz = 28 - i * 3;
        el.style.width = sz + 'px';
        el.style.height = sz + 'px';
        el.style.backgroundImage = "url('" + curSrc + "')";
        document.body.appendChild(el);
        dots.push({ el, x: -100, y: -100, vx: 0, vy: 0 });
      }
      document.addEventListener('mousemove', (e) => { mx = e.clientX; my = e.clientY; });
      (function loop() {
        let px = mx, py = my;
        for (let i = 0; i < dots.length; i++) {
          const d = dots[i];
          d.vx = (d.vx + (px - d.x) * SPRING) * FRICTION;
          d.vy = (d.vy + (py - d.y) * SPRING) * FRICTION;
          d.x += d.vx; d.y += d.vy;
          d.el.style.transform = 'translate(' + d.x + 'px,' + d.y + 'px)';
          d.el.style.opacity = ((1 - i / dots.length) * 0.2).toFixed(3);
          px = d.x; py = d.y;
        }
        requestAnimationFrame(loop);
      })();
    }
  </script>
</body>
</html>
